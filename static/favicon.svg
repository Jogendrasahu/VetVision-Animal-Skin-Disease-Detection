<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="avIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>

    <!-- Cyber-Vision Primary Gradient -->
    <linearGradient id="avIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Radiant Glow Gradient -->
    <radialGradient id="avCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#avIconBg)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5"/>

  <!-- Optical Camera Viewfinder Reticles (Corners) -->
  <path d="M 22 36 L 22 22 L 36 22" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 106 36 L 106 22 L 92 22" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 92 L 22 106 L 36 106" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 106 92 L 106 106 L 92 106" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer Scanning Radar Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="41" fill="none" stroke="url(#avIrisGrad)" stroke-width="2" stroke-dasharray="14 7"/>

  <!-- Abstract Animal Intelligence Silhouette (Integrated Geometric Form) -->
  <!-- Sculpted profile merging canine/feline alert posture with biometric contour -->
  <path d="M 38 90 
           C 38 78, 44 65, 47 57 
           C 49 51, 48 37, 52 24 
           C 54 20, 58 19, 61 24 
           C 64 28, 65 37, 70 41 
           C 77 45, 87 48, 92 57 
           C 95 64, 91 71, 84 73 
           C 77 75, 71 68, 64 70 
           C 57 72, 50 84, 43 90 Z" 
        fill="url(#avIrisGrad)" 
        fill-opacity="0.25" 
        stroke="url(#avIrisGrad)" 
        stroke-width="2.2" 
        stroke-linejoin="round"/>

  <!-- Secondary Ear / Brow Biometric Contour -->
  <path d="M 45 44 C 43 34, 45 26, 49 21 C 52 24, 53 32, 55 38" 
        fill="none" 
        stroke="rgba(56, 189, 248, 0.6)" 
        stroke-width="1.8" 
        stroke-linecap="round"/>

  <!-- Central Vision Iris Glow -->
  <circle cx="66" cy="55" r="22" fill="url(#avCoreGlow)"/>

  <!-- Concentric Precision Vision Iris Ring -->
  <circle cx="66" cy="55" r="16" fill="#090d16" stroke="#38bdf8" stroke-width="2.2"/>
  <circle cx="66" cy="55" r="10" fill="rgba(37, 99, 235, 0.4)" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Central Optical Core Diode (Sensor Point) -->
  <circle cx="66" cy="55" r="4.5" fill="#ffffff" filter="url(#avGlow)"/>
  <circle cx="68" cy="53" r="1.5" fill="#38bdf8"/>

  <!-- Neural Network Synaptic Filaments -->
  <line x1="61" y1="24" x2="66" y2="55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <line x1="92" y1="57" x2="66" y2="55" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <line x1="47" y1="74" x2="66" y2="55" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <line x1="77" y1="75" x2="66" y2="55" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.6" stroke-dasharray="2 2"/>

  <!-- Neural Network Synapse Vertices / Nodes -->
  <circle cx="61" cy="24" r="3.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="92" cy="57" r="3.8" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="47" cy="74" r="3.2" fill="#60a5fa" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="77" cy="75" r="3.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
</svg>
